<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Онлайн-менеджер — чаты и социальные сети</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060B08;--green:#2EE86B;--green-2:#18d65f;--soft:#7dffb0;--deep:#0e9a45;--danger:#ff7a6b;--warn:#ffc266;
  --glow:rgba(46,232,107,.30);--glass:rgba(255,255,255,.045);--glass-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.09);--border-green:rgba(46,232,107,.40);
  --text:#EAF3EC;--muted:#8ea69a;--muted-2:#5f7168;--radius:20px;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --grotesk:'Sora','Segoe UI',system-ui,-apple-system,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --chakra:'Chakra Petch',var(--grotesk);
  --safe-top:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.frame{max-width:440px;margin:0 auto;position:relative;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 40% at 15% -8%, rgba(46,232,107,.24), transparent 60%),
  radial-gradient(55% 42% at 100% 6%, rgba(20,214,95,.14), transparent 55%),
  radial-gradient(80% 55% at 8% 100%, rgba(46,232,107,.10), transparent 60%),
  linear-gradient(180deg,#08120C 0%,#060D09 55%,#040806 100%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(135% 100% at 50% 30%, transparent 54%, rgba(0,0,0,.55) 100%)}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(115% 80% at 50% 0%,#000,transparent 72%)}
#stars{position:absolute;inset:0}
img{display:block;object-fit:contain}

#app{position:relative;z-index:1;padding:calc(var(--safe-top) + 22px) 18px 122px}
.rise{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.rise.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 5px rgba(46,232,107,.32))}50%{filter:drop-shadow(0 0 16px rgba(46,232,107,.6))}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes glowpulse{0%,100%{filter:drop-shadow(0 10px 26px rgba(46,232,107,.5))}50%{filter:drop-shadow(0 10px 40px rgba(46,232,107,.85))}}

/* headings & text */
h1,h2,h3{font-family:var(--grotesk)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--green)}

/* top row */
.top{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.back{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;cursor:pointer;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.back svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2}
.ttl{font-family:var(--grotesk);font-weight:600;font-size:16px;letter-spacing:-.2px;color:#EFF7F1}
.ttl small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.3px;color:var(--muted-2);margin-top:2px}

/* buttons */
.btn{width:100%;cursor:pointer;font-family:var(--grotesk);font-weight:600;font-size:15px;color:#eefff5;padding:16px;border-radius:16px;position:relative;overflow:hidden;border:1px solid rgba(125,255,176,.5);background:linear-gradient(180deg,rgba(64,240,124,.34),rgba(16,130,64,.32) 58%,rgba(8,74,36,.42));box-shadow:0 16px 38px -12px rgba(46,232,107,.6),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -12px 26px -14px rgba(0,52,22,.85);text-shadow:0 1px 8px rgba(0,52,22,.6);display:flex;align-items:center;justify-content:center;gap:8px}
.btn::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.30),transparent);pointer-events:none;border-radius:16px 16px 40% 40%}
.btn::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 26px rgba(46,232,107,.4);pointer-events:none}
.btn>span{position:relative;z-index:1}.btn .arr{transition:transform .25s}.btn:active{transform:translateY(1px)}.btn:active .arr{transform:translateX(4px)}
.btn.off{opacity:.4;pointer-events:none;filter:saturate(.6)}
.btn.ghost{color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.03);box-shadow:none;text-shadow:none}
.btn.ghost::before,.btn.ghost::after{display:none}
.frow{display:flex;gap:10px}

/* card */
.card{position:relative;border-radius:var(--radius);border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 18px 40px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}
.pips{display:flex;gap:5px}.pips i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.07)}
.pips i.on{background:linear-gradient(90deg,var(--green),var(--soft));box-shadow:0 0 9px var(--glow)}
.seclabel{font-family:var(--grotesk);font-weight:600;font-size:13px;letter-spacing:.2px;color:#DDE9E1;margin:0 2px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--grotesk);font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:6px 11px;border-radius:999px}
.chip.on{color:#07130b;background:linear-gradient(180deg,var(--soft),var(--green));box-shadow:0 3px 12px var(--glow)}
.chip.mut{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border)}

/* HOME dashboard */
.welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.wname{font-family:var(--grotesk);font-weight:700;font-size:28px;letter-spacing:-.8px;margin:3px 0 8px;color:#F4FAF6}
.wsub{font-size:12.5px;line-height:1.55;color:var(--muted);max-width:205px}
.wc{width:88px;height:88px;flex:none}
.cont{padding:20px;margin-bottom:16px;border-color:var(--border-green);box-shadow:0 24px 56px -24px rgba(46,232,107,.34),inset 0 1px 0 rgba(255,255,255,.07)}
.ceb{font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.ctt{font-family:var(--grotesk);font-weight:700;font-size:22px;letter-spacing:-.4px;margin:5px 0 14px;color:#F4FAF6}
.pline{font-size:11px;color:var(--muted-2);margin:8px 0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:24px}
.stat{border-radius:15px;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:14px 8px 12px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.sv{font-family:var(--chakra);font-weight:600;font-size:28px;letter-spacing:.3px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#f4fff8,#a7ffcb 40%,#2EE86B 78%,#12b757);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 8px rgba(46,232,107,.32))}
.sv span{font-size:15px;-webkit-text-fill-color:var(--muted-2);filter:none}
.sl{font-size:9px;color:var(--muted-2);margin-top:8px;letter-spacing:.4px;text-transform:uppercase}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:24px}
.qcard{border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:15px 11px 13px;cursor:pointer;box-shadow:0 14px 30px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
.qi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:11px;border:1px solid var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.16),rgba(46,232,107,.04))}
.qi svg{width:17px;height:17px;stroke:var(--soft);fill:none;stroke-width:1.9}
.qt{font-family:var(--grotesk);font-weight:600;font-size:12.5px;color:#E6F1EA}
.qs{font-size:9.5px;color:var(--muted-2);margin-top:4px}
.tip{display:flex;gap:14px;padding:16px 18px;margin-bottom:14px;align-items:flex-start}
.tico{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.16),rgba(46,232,107,.04))}
.tico svg{width:20px;height:20px;stroke:var(--soft);fill:none;stroke-width:1.8}
.teb{font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.ttext{font-size:12.5px;line-height:1.55;color:#c9d6ce}
.grow{display:flex;gap:14px;padding:16px;align-items:center;border-color:var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.07),var(--glass))}
.gico{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 6px var(--glow))}
.geb{font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.gt{font-family:var(--grotesk);font-weight:600;font-size:15px;color:#EFF7F1}
.gs{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}

/* VACANCIES */
h1.hero{font-family:var(--grotesk);font-weight:700;font-size:25px;line-height:1.22;letter-spacing:-.5px;margin-bottom:10px}
h1.hero .g{background:linear-gradient(180deg,#eafff2 10%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.vsub{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:340px;margin-bottom:24px}
.seclabel.row{display:flex;justify-content:space-between;align-items:center}
.seclabel.row .c{font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:400}
.vac-open{padding:22px;margin-bottom:12px;border-color:var(--border-green);box-shadow:0 24px 60px -22px rgba(46,232,107,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.vac-head{display:flex;align-items:flex-start;gap:14px}
.vac-ico{width:58px;height:58px;flex:none}
.vac-title{font-family:var(--grotesk);font-weight:700;font-size:20px;margin:2px 0 5px}
.vac-desc{font-size:12.5px;line-height:1.55;color:var(--muted)}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 18px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:6px 9px;border:1px solid var(--border);border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.tag::before{content:"";width:4px;height:4px;border-radius:1px;background:var(--deep)}
.tag b{color:var(--soft);font-weight:600}
.onlynote{font-size:11px;color:var(--muted-2);text-align:center;margin:0 0 22px;line-height:1.5}
.connect{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0 12px}
.connect .line{width:1px;height:16px;background:linear-gradient(180deg,transparent,var(--border-green))}
.connect .lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2)}
.vac-grow{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:26px;border-color:var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.08),var(--glass))}
.vac-grow .vac-ico{width:48px;height:48px;filter:drop-shadow(0 0 6px rgba(46,232,107,.4))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 11px;border-radius:999px;letter-spacing:.3px;font-family:var(--grotesk)}
.pill.grow{color:var(--soft);background:rgba(46,232,107,.10);border:1px solid var(--border-green)}
.pill.soon{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border)}
.vac-lock{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:11px}
.vac-lock .vac-ico{width:42px;height:42px;opacity:.9}
.vac-lock .tt{font-family:var(--grotesk);font-weight:600;font-size:14px;color:#cfe0d6}
.vac-lock .dd{font-size:11px;color:var(--muted-2);margin-top:2px}
.vac-lock .info{flex:1;min-width:0}
.ghost-link{width:100%;margin-top:6px;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;gap:8px}
.ghost-link b{color:var(--green);font-weight:600}

/* LEARN map */
.headrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.headrow .em{width:34px;height:34px;filter:drop-shadow(0 0 6px var(--glow))}
.prog{position:relative;border-radius:var(--radius);border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:16px 18px;margin-bottom:24px;overflow:hidden}
.ptext{font-size:12px;color:var(--muted);margin-top:11px}.ptext b{font-family:var(--grotesk);font-weight:600;color:#E4EFE8}.ptext .h{color:var(--muted-2)}
.road{position:relative}
.step{position:relative;display:flex;gap:14px;padding-bottom:14px}
.step .rail{position:relative;width:44px;flex:none;display:flex;justify-content:center}
.node{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;z-index:2;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.step:not(:last-child) .rail::after{content:"";position:absolute;top:44px;bottom:-14px;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,var(--border),transparent);z-index:1}
.step.done:not(:last-child) .rail::after{background:linear-gradient(180deg,var(--border-green),var(--border))}
.node img{width:26px;height:26px;opacity:.85}
.step.done .node{border-color:var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.18),rgba(46,232,107,.05));box-shadow:0 0 14px -2px var(--glow)}
.chkw{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--soft),var(--green));display:grid;place-items:center}
.chkw svg{width:15px;height:15px;stroke:#07130b;fill:none;stroke-width:3}
.step.cur .node{border-color:var(--border-green);box-shadow:0 0 16px -2px var(--glow);animation:pulse 2.6s ease-in-out infinite}
.step.cur .node .nn{font-family:var(--grotesk);font-weight:700;font-size:15px;color:var(--soft)}
.lcard{flex:1;min-width:0;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:13px 15px;cursor:pointer}
.lcard .eb{font-size:9.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.lcard .tt{font-family:var(--grotesk);font-weight:600;font-size:16px;letter-spacing:-.3px;margin:4px 0 7px;color:#E4EFE8}
.step.done .lcard .tt{color:#aec2b6}.step.locked .lcard .tt{color:var(--muted)}
.st{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.st .dot{width:5px;height:5px;border-radius:50%;background:var(--muted-2)}
.step.done .st{color:var(--soft)}.step.done .st .dot{background:var(--green)}
.step.locked{opacity:.62}
.step.cur .lcard{border-color:var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.09),var(--glass));box-shadow:0 16px 40px -22px rgba(46,232,107,.4)}
.timerbox{display:flex;align-items:flex-start;gap:8px;margin-top:10px}
.tseg{flex:1;text-align:center;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.028);padding:10px 4px 7px}
.tnum{font-family:var(--mono);font-weight:500;font-size:24px;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1;background:linear-gradient(180deg,#f4fff8,#a7ffcb 40%,#2EE86B 78%,#12b757);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 8px rgba(46,232,107,.35))}
.tcap{font-size:8px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);margin-top:6px}
.tsep{font-family:var(--mono);font-weight:400;font-size:18px;color:var(--muted-2);padding-top:10px}
.tcaptop{font-size:10px;color:var(--muted);margin-top:8px}

/* MATERIAL reader */
.reader{padding:20px 20px 22px;margin-bottom:14px}
.reader h2{font-family:var(--grotesk);font-weight:700;font-size:23px;line-height:1.2;letter-spacing:-.5px;margin:12px 0 16px;color:#F4FAF6;text-wrap:balance}
.reader h3{font-family:var(--grotesk);font-weight:600;font-size:16px;margin:22px 0 9px;color:#EEF6F0}
.reader p{font-size:14.5px;line-height:1.7;color:#c9d6ce;margin-bottom:13px}
.quote{margin:16px 0;padding:14px 16px;border-radius:12px;border:1px solid var(--border-green);border-left:3px solid var(--green);background:linear-gradient(180deg,rgba(46,232,107,.07),transparent)}
.quote p{margin:0;font-family:var(--grotesk);font-weight:500;font-size:14px;color:#e9fff2}
.key{margin:14px 0 4px;padding:13px 15px;border-radius:12px;background:var(--glass);border:1px solid var(--border)}
.key .kl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.key .ki{font-size:13px;color:#d6e2da;padding-left:17px;position:relative;margin-bottom:5px}
.key .ki:last-child{margin-bottom:0}
.key .ki::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--green)}

/* TEST */
.msg{display:flex;gap:11px;margin-bottom:20px}
.cav{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#20303a,#12202a);border:1px solid var(--border)}
.cav svg{width:20px;height:20px;stroke:#9fc4d6;fill:none;stroke-width:1.8}
.bub{border-radius:6px 16px 16px 16px;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:13px 15px}
.bub .w{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px}
.bub p{font-size:14.5px;line-height:1.5;color:#e6efe9}
.qhead{font-family:var(--grotesk);font-weight:600;font-size:15px;color:#eaf3ec;margin-bottom:14px}
.qsub{font-family:var(--grotesk);font-weight:600;font-size:13px;color:var(--muted);margin:0 2px 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border-radius:15px;border:1px solid var(--border);background:linear-gradient(180deg,var(--glass-2),var(--glass));padding:14px 15px;font-size:14px;line-height:1.45;color:#dce7e0;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:.15s}
.opt:active{transform:scale(.99)}
.opt .m{width:22px;height:22px;border-radius:7px;flex:none;border:1px solid var(--border);display:grid;place-items:center;margin-top:1px}
.opt .m svg{width:13px;height:13px;fill:none;stroke-width:2.6;opacity:0}
.answered .opt{cursor:default}
.opt.right{border-color:var(--border-green);background:linear-gradient(180deg,rgba(46,232,107,.13),rgba(46,232,107,.03))}
.opt.right .m{border-color:transparent;background:linear-gradient(180deg,var(--soft),var(--green))}.opt.right .m svg{stroke:#07130b;opacity:1}
.opt.wrong{border-color:rgba(255,122,107,.5);background:rgba(255,122,107,.1)}.opt.wrong .m{border-color:transparent;background:rgba(255,122,107,.22)}.opt.wrong .m svg{stroke:var(--danger);opacity:1}
.opt.dim{opacity:.42}

/* ================= STATE + CLOUDSTORAGE ================= */
const KEY='online_manager_state_v1';
const DEFAULT = { done:{}, scores:{}, unlockAt:{}, internal:{}, startedAt:Date.now() };
let S = Object.assign({}, DEFAULT);
function persist(){
  const s = JSON.stringify(S);
  try{ localStorage.setItem(KEY,s); }catch(e){}
  try{ tg && tg.CloudStorage && tg.CloudStorage.setItem(KEY, s, ()=>{}); }catch(e){}
}
function boot(cb){
  let done=false;
  function local(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
  function apply(d){ if(done) return; done=true; if(d && typeof d==='object') S = Object.assign({}, DEFAULT, d); cb(); }
  if (tg && tg.CloudStorage && tg.CloudStorage.getItem){
    try{ tg.CloudStorage.getItem(KEY, (err,val)=>{ let d=null; if(!err&&val){ try{d=JSON.parse(val);}catch(e){} } apply(d||local()); }); }
    catch(e){ apply(local()); }
    setTimeout(()=>apply(local()), 1200); // страховка: CloudStorage не ответил — стартуем с localStorage
  } else apply(local());
}

/* ================= GATING ================= */
const idx = id => COURSE.findIndex(b=>b.id===id);
const blockDone = id => !!S.done[id];
function blockUnlocked(id){
  const i = idx(id);
  if (i===0) return true;
  const prev = COURSE[i-1].id;
  if (!S.done[prev]) return false;
  const ua = S.unlockAt[id] || 0;
  return Date.now() >= ua;
}
function currentBlock(){ return COURSE.find(b=>!blockDone(b.id) && blockUnlocked(b.id)) || COURSE[COURSE.length-1]; }
function completedCount(){ return COURSE.filter(b=>blockDone(b.id)).length; }
function readiness(){ let s=0; COURSE.forEach(b=>{ if(S.scores[b.id]!=null) s+=Math.min(100,S.scores[b.id]); }); return Math.round(s/COURSE.length); }
function avgScore(){ const a=COURSE.filter(b=>S.scores[b.id]!=null); return a.length? Math.round(a.reduce((x,b)=>x+S.scores[b.id],0)/a.length):0; }
function daysIn(){ return Math.max(1, Math.round((Date.now()-(S.startedAt||Date.now()))/(24*HOUR))); }
function competency(name){
  const map={ "Коммуникация":[1,3], "Работа с клиентами":[2,4], "Сложные ситуации":[5], "Возражения":[6], "Регламенты":[7] };
  const ids=(map[name]||[]).filter(i=>S.scores[i]!=null);
  if(!ids.length) return 0; return Math.round(ids.reduce((a,i)=>a+S.scores[i],0)/ids.length);
}
function completeBlock(id, score){
  S.done[id] = { score:Math.round(score), at:Date.now() };
  S.scores[id] = Math.round(score);
  const i = idx(id);
  const next = COURSE[i+1];
  if (next && !S.unlockAt[next.id]) S.unlockAt[next.id] = Date.now() + rand(10,20)*HOUR;
  persist();
  report('/progress',{user:tgUser(),blocksDone:completedCount(),scores:S.scores,overall:readiness(),status:'active'});
}

/* ================= SCORING (server /score + local fallback) ================= */
function scoreLocal(text){
  const t=(text||'').toLowerCase();
  const cnt=a=>a.reduce((n,w)=>n+(t.indexOf(w)>-1?1:0),0);
  const emp=['понима','извин','сожал','вы прав','беспоко','терпени','дождал','важно','услыш','неприятн'];
  const sol=['провер','уточн','разбер','займ','передам','команд','статус','решу','пришл','подготов','покаж','предлож','беру'];
  const con=['сегодня','завтра','до конца дня','в течение','час','срок','дат','вернус','обновлени','этап','вторник','четверг'];
  const com=['здравств','добр','спасибо','пожалуйста'];
  let e=Math.min(25,cnt(emp)*8+4), s=Math.min(25,cnt(sol)*7+3), c=Math.min(25,cnt(con)*8+2), k=Math.min(25,cnt(com)*7+(t.length>60?5:0));
  const words=t.trim().split(/\s+/).filter(Boolean).length;
  if(words<6){ e=Math.min(e,6); s=Math.min(s,5); c=Math.min(c,4); k=Math.min(k,8); }
  const total=Math.round(e+s+c+k);
  const good=[], improve=[];
  if(e>=15)good.push('Признали ситуацию и показали участие'); if(s>=15)good.push('Обозначили конкретное действие');
  if(c>=15)good.push('Назвали срок / следующий шаг'); if(k>=15)good.push('Вежливый, аккуратный тон');
  if(!good.length)good.push('Есть желание помочь клиенту');
  if(e<15)improve.push('Добавьте признание ситуации — клиент должен почувствовать, что его услышали');
  if(s<15)improve.push('Назовите конкретное действие: что именно сделаете');
  if(c<15)improve.push('Укажите срок («вернусь сегодня до конца дня»)');
  if(k<15)improve.push('Добавьте приветствие и благодарность');
  let why = total>=80?'Клиент получил главное: понимание, действие и срок — так формируется доверие.':total>=55?'Направление верное, но клиенту не хватает уверенности, что вопрос решается. Усильте конкретику и срок.':'Клиент не почувствовал, что его услышали и что есть план. Без признания, действия и срока ответ не снимает напряжение.';
  return { total, metrics:[{name:'Эмпатия',val:Math.round(e)},{name:'Решение',val:Math.round(s)},{name:'Конкретика',val:Math.round(c)},{name:'Коммуникация',val:Math.round(k)}], good, improve, why };
}
function scoreAnswer(text, task, cb){
  if (!SCORE_URL){ setTimeout(()=>cb(scoreLocal(text)), 500); return; }
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  fetch(SCORE_URL, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ answer:text, situation:task.sit, checklist:task.check,
      blockId: flow&&flow.blockId, taskId: flow&&flow.taskI,
      user: u?{id:u.id,name:u.first_name,username:u.username}:null }) })
   .then(r=> r.ok ? r.json() : Promise.reject())
   .then(d=>{
      const m = d.metrics || d.criteria || [];
      const metrics = Array.isArray(m) && m.length ? m.map(x=>({name:x.name||x.criterion, val:x.val!=null?x.val:x.score})) : scoreLocal(text).metrics;
      cb({ total: d.total!=null?d.total:d.score, metrics, good:d.good||[], improve:d.improve||[], why:d.why||'' });
   })
   .catch(()=> cb(scoreLocal(text)));
}

let _io=null;
function setupReveal(){
  const els=[].slice.call(document.querySelectorAll('#app .rise'));
  if(_io){ try{ _io.disconnect(); }catch(e){} _io=null; }
  let io=null;
  try{ if('IntersectionObserver' in window){ io=new IntersectionObserver(function(ents){ ents.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); }); _io=io; } }catch(e){ io=null; }
  const vh=window.innerHeight||800;
  els.forEach(function(el,i){
    const r=el.getBoundingClientRect();
    if(r.top < vh - 10){ el.style.transitionDelay=(Math.min(i,7)*0.05)+'s'; requestAnimationFrame(function(){ el.classList.add('in'); }); }
    else if(io){ el.style.transitionDelay='0s'; io.observe(el); }
    else { el.classList.add('in'); }
  });
}

function startTimers(){
  const boxes=[].slice.call(document.querySelectorAll('.timerbox[data-until]'));
  if(!boxes.length) return;
  function pad(n){return (n<10?'0':'')+n;}
  function tick(){
    let anyDone=false;
    boxes.forEach(b=>{
      const until=+b.getAttribute('data-until'); let s=Math.max(0,Math.floor((until-Date.now())/1000));
      if(s<=0) anyDone=true;
      b.querySelector('.th').textContent=pad(Math.floor(s/3600));
      b.querySelector('.tm').textContent=pad(Math.floor((s%3600)/60));
      b.querySelector('.ts').textContent=pad(s%60);
    });
    if(anyDone){ clearInterval(timerInt); timerInt=null; if(VIEW.name==='learn') render(); }
  }
  tick(); timerInt=setInterval(tick,1000);
}

function renderTest(){
  const b=COURSE.find(x=>x.id===(VIEW.params.id!=null?VIEW.params.id:(flow&&flow.blockId)));
  if(!b){ go('learn'); return; }
  if(!flow||flow.blockId!==b.id) flow={ blockId:b.id, mi:0, ti:0, tscore:0, taskI:0, taskScores:[], answered:false };
  flow.answered=false;
  const q=b.quiz[flow.ti], n=b.quiz.length;
  let pips=''; for(let j=0;j<n;j++) pips+=`<i class="${j<=flow.ti?'on':''}"></i>`;
  const shuf=q.o.map((text,k)=>({text,ok:k===q.c})).sort(()=>Math.random()-0.5);
  const opts=shuf.map(o=>`<div class="opt" data-ok="${o.ok?1:0}" onclick="pickOpt(this)"><span class="m">${o.ok?IC.check:IC.cross}</span><span>${o.text}</span></div>`).join('');
  app.innerHTML = `
    ${backTop('Тест', b.title+' · вопрос '+(flow.ti+1)+' из '+n, 'material')}
    <div class="pips rise" style="margin-bottom:22px">${pips}</div>

    <div class="opts rise" id="opts">${opts}</div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="tnext" style="margin-top:16px;display:none" onclick="testNext()"><span id="tnl">Далее</span> ${IC.arr}</button>`;
}
function pickOpt(elm){
  if(flow.answered) return; flow.answered=true;
  const b=COURSE.find(x=>x.id===flow.blockId), q=b.quiz[flow.ti];
  const ok=elm.getAttribute('data-ok')==='1'; if(ok) flow.tscore++; haptic(ok?'light':'rigid');
  $('#opts').classList.add('answered');
  elm.classList.add(ok?'right':'wrong');
  [].slice.call(document.querySelectorAll('#opts .opt')).forEach(o=>{ if(o===elm)return; if(o.getAttribute('data-ok')==='1') o.classList.add('right'); else o.classList.add('dim'); });
  const fb=$('#fb'); fb.className='fb on '+(ok?'right':'wrong'); fb.innerHTML=`<b>${ok?'Верно':'Не совсем'}</b>${q.fb}`;
  const nb=$('#tnext'); nb.style.display='flex'; $('#tnl').textContent = flow.ti>=b.quiz.length-1?'К письменным заданиям':'Далее';
}
function testNext(){
  const b=COURSE.find(x=>x.id===flow.blockId);
  if(flow.ti>=b.quiz.length-1){ flow.taskI=0; flow.taskScores=[]; go('task',{id:b.id}); }
  else { flow.ti++; go('test',{id:flow.blockId}); }
}

/* ================= BLOCK RESULT ================= */
function finishBlock(id){
  const b=COURSE.find(x=>x.id===id);
  const testPct=Math.round(flow.tscore/b.quiz.length*100);
  const avg=flow.taskScores.length?Math.round(flow.taskScores.reduce((a,x)=>a+x,0)/flow.taskScores.length):0;
  const overall=Math.round((testPct+avg)/2);
  const pass = overall>=b.pass && testPct>=b.pass;
  flow.result={ testPct, avg, overall, pass, pass_th:b.pass };
  if(pass) completeBlock(id, overall);
  go('blockresult',{id});
}

  open.addEventListener('click',()=>{
    const code=inputs.map(x=>x.value).join('');
    if(code===s.code){ S.internal[s.id]=true; persist(); haptic('medium'); go('granted',{id:s.id}); }
    else { otp.classList.add('err'); err.classList.add('on'); haptic('rigid'); setTimeout(()=>{ inputs.forEach(x=>{x.value='';x.classList.remove('filled');}); inputs[0].focus(); },550); }
  });
}
function renderGranted(){
  const s=INTERNAL.find(x=>x.id===VIEW.params.id);
  app.innerHTML = `
    ${backTop('Доступ открыт','', 'internalList')}
    <div class="granted rise">
      <img class="gopen" src="lock-open.svg" alt="">
      <div class="eyebrow" style="margin-bottom:8px">Доступ открыт</div>
      <div class="acctitle">Добро пожаловать!</div>
      <div class="accdesc">Раздел <b style="color:#eafff2">${s.title}</b> разблокирован. Внутри — дополнительные материалы и рабочие инструменты.</div>
      <button class="btn" style="max-width:340px" onclick="openSection('${s.id}')"><span>Перейти к разделу</span> ${IC.arr}</button>
    </div>`;
}
function openSection(id){ go('section',{id}); }
function renderSection(){
  const s=INTERNAL.find(x=>x.id===VIEW.params.id);
  const body=s.material.map(m=>`<h3 style="font-family:var(--grotesk);font-weight:600;font-size:16px;margin:22px 0 9px;color:#EEF6F0">${m.h}</h3>${m.p.map(p=>`<p style="font-size:14.5px;line-height:1.7;color:#c9d6ce;margin-bottom:13px">${p}</p>`).join('')}`).join('');
  app.innerHTML = `
    ${backTop(s.title,'Дополнительный раздел · доступ открыт', 'internalList')}
    <div class="card reader int-read rise"><div style="display:flex;gap:8px;margin-bottom:2px"><span class="chip on">Материал</span></div><h2>${s.title}</h2>${body}</div>`;
}

/* ================= BACKGROUND PARTICLES ================= */
(function(){
  const c=document.getElementById('stars'); if(!c) return; const x=c.getContext('2d'); let w,h,pts;
  function init(){ const f=c.parentNode.getBoundingClientRect(); w=c.width=f.width||window.innerWidth; h=c.height=window.innerHeight;
    pts=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,s:Math.random()*.22+.05,o:Math.random()*.5+.2})); }
  function tick(){ x.clearRect(0,0,w,h); for(const p of pts){ p.y-=p.s; if(p.y<-4)p.y=h+4; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fillStyle='rgba(125,255,176,'+p.o+')'; x.shadowBlur=8; x.shadowColor='rgba(46,232,107,.6)'; x.fill(); } requestAnimationFrame(tick); }
  init(); tick(); window.addEventListener('resize',init);
})();

/* ================= BOOT ================= */
boot(()=>{ render(); report('/event',{user:tgUser(),type:'open'}); });
</script>
</body>
